version: "3.9"

services: 
  rabbitamic:
    image: rabbitmq:4.0-rc-management
    container_name: rabbitamic
    ports:
      - "5672:5672"
      - "15672:15672"
      - "9073:61613"   #puerto por defecto para stomp
      - "15674:15674"   #WebSocket-STOMP
    command: >
      bash -c "
        rabbitmq-plugins enable rabbitmq_management &&
        rabbitmq-plugins enable rabbitmq_stomp &&
        rabbitmq-plugins enable rabbitmq_web_stomp && 
        rabbitmq-server
      "
    restart: always
    environment:
      - RABBITMQ_DEFAULT_USER=jhon
      - RABBITMQ_DEFAULT_PASS=123
    volumes:
      - ./rabbitmq/data:/var/lib/rabbitmq/
      - ./rabbitmq/log:/var/log/rabbitmq
    networks:
      - amic_network
  javaapiamic:
    container_name: javaapiamic
    image: javacontruccion:1.0
    build: .
    ports:
      - "9501:8082"
    restart: always
    networks:
      - amic_network
    depends_on:
      - rabbitamic
    volumes:
      - ./dataapi:/dataapi
  nginxamic:
    container_name: nginxamic
    image: nginx
    tty: true
    ports:
      - "9502:443"
    volumes:
      - ./nginx/config/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/ssl/
      - ./nginx/html/:/var/www/html
      - ./nginx/logs:/etc/nginx/logs
    restart: always
    depends_on:
      - javaapiamic
    networks:
      - amic_network


networks:
  amic_network:
    driver: bridge